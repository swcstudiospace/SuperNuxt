name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test, check, typecheck, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (builds @swcstudio/supernuxt-core and @swcstudio/supernuxt-nuxt)
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint and format
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  packages:
    name: package dry-runs (npm + JSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      - name: publint + are-the-types-wrong
        run: npm run lint:pkg

      - name: npm pack --dry-run
        run: npm run pack:dry

      - name: deno publish --dry-run
        run: deno publish --dry-run
